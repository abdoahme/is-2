name: Financial integrity checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check api/assistant.js
      - run: node --test tests/financial-integrity.test.cjs
