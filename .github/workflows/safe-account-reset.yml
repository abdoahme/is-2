name: Validate IS Motors app syntax

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/safe-account-reset]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check browser application syntax
        run: node --check app.js
